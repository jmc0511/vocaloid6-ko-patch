# 번역(translation/) 또는 도구가 바뀌어 main에 push되면 빌드하고 새 릴리스를 만든다.
# 사용자 PC의 자동 업데이터가 최신 릴리스의 VOCALOID6-KoPatch.zip을 받아 적용한다.
name: release

on:
  push:
    branches: [main]
    paths:
      - 'translation/**'
      - 'tools/**'
      - 'installer/**'
      - 'build.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          $v = "v$(Get-Date -Format 'yyyy.MM.dd').${{ github.run_number }}"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build patch
        shell: pwsh
        run: ./build.ps1 -PatchVersion ${{ steps.ver.outputs.version }}

      - name: Package installer
        shell: pwsh
        run: |
          Copy-Item README.md installer/
          Compress-Archive -Path installer/* -DestinationPath dist/VOCALOID6-KoPatch-Installer.zip -Force

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $notes = "자동 빌드: $v`n`n처음 설치: VOCALOID6-KoPatch-Installer.zip을 받아 압축을 풀고 install.bat 실행`n이미 설치했다면 자동으로 업데이트됩니다."
          gh release create $v dist/VOCALOID6-KoPatch.zip dist/VOCALOID6-KoPatch-Installer.zip --title $v --notes $notes
